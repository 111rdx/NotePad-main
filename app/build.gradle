plugins {
    id 'com.android.application'
}

android {
    // The original sample tests use Android's legacy test APIs.
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    useLibrary 'android.test.mock', false
    namespace 'com.example.android.notepad'
    compileSdk 34  // <--- 确认这里是 34

    defaultConfig {
        applicationId "com.example.android.notepad"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildToolsVersion "34.0.0"
}

// Activities use the framework UI; no AppCompat dependency is needed.
